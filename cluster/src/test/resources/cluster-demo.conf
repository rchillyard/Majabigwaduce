# Configuration for the two-terminal CountWords demo (ClusterDemo.scala; see doc/Clustering.md).
# Both nodes load this file; each main then sets its own port.

include "application"

pekko {
  actor {
    provider = cluster
    # NOTE clustered jobs send their reducer functions to other nodes using Java serialization.
    # Only switch it on for a trusted cluster.
    allow-java-serialization = on
    warn-about-java-serializer-usage = off
  }
  remote.artery.canonical.hostname = "127.0.0.1"
  # The worker node (port 2551) is the seed node: the master node joins it.
  cluster.seed-nodes = ["pekko://CountWordsCluster@127.0.0.1:2551"]
}
