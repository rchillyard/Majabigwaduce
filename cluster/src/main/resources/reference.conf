# Default configuration for the majabigwaduce-cluster module (see doc/Clustering.md).
# Override these in your application.conf.
#
# NOTE this module does NOT switch on Java serialization for you. Clustered jobs send their
# reducer functions to other nodes using Java serialization, which is only safe on a trusted
# network, so your application must set this itself:
#
#   pekko.actor.allow-java-serialization = on

majabigwaduce {
  cluster {
    # The WorkerPool which a Master uses when its ActorSystem is a cluster member.
    worker-pool = "com.phasmid.majabigwaduce.cluster.ClusterWorkerPool"

    # The number of worker nodes (nodes which have started a ClusterWorker) which must be
    # available before a job's reducers are spread across them.
    min-workers = 1

    # How long a Master waits for min-workers workers to appear.
    discovery-timeout = 10 seconds

    # How long a Master waits for a worker to spawn its share of the reducers.
    spawn-timeout = 5 seconds
  }
}
